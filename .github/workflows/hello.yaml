name: Hello World!

on:
  push:
    branches: [feature/githubactions]
  workflow_dispatch:
jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print a message
        run: echo "Hello from GitHub Actions!"

      - name: This will fail
        run: exit 1
        continue-on-error: true

      - name: Show files in repo
        run: ls -la
